version: '3.8'

services:
  # Base de datos PostgreSQL para Keycloak
  biopatternsg-postgres:
    image: postgres:15
    container_name: biopatternsg-postgres
    restart: always
    environment:
      POSTGRES_DB: biopatternsg
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biopatternsg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - general-network

  # Keycloak 26 (Sin multitenancy)
  keycloak-biopatternsg:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: keycloak-biopatternsg
    command: start-dev --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    depends_on:
      - biopatternsg-postgres
    environment:
      # --- Base de Datos (Esquema simple public) ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://biopatternsg-postgres:5432/biopatternsg
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-biopatternsg}

      # --- Proxy y Acceso por IP ---
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: "http://167.86.120.57:8005"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"

      # --- Administrador inicial ---
      KEYCLOAK_ADMIN: ${KC_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD:-biopatternsg}

    ports:
      - "8005:8080"
    networks:
      - general-network
    restart: always

volumes:
  postgres_data:

networks:
  general-network:
    external: true
